<style>
:root{color-scheme:dark;--bg:#07152b;--panel:#0e2342;--line:rgba(214,231,255,.16);--muted:#aabbd2;--blue:#62b6ff;--white:#f5faff;--shadow:0 25px 85px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--white)}body{overflow:hidden}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8bd3ff;outline-offset:3px}a{color:inherit;text-decoration:none}.ambient{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse 60% 75% at 12% 10%,#164b83a1,transparent 70%),radial-gradient(ellipse 45% 50% at 90% 90%,#00699c59,transparent 72%);z-index:0}.shell{position:relative;z-index:1;min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.topbar{height:76px;padding:0 clamp(16px,3vw,48px);display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);background:#07172bce;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandmark{height:37px;width:37px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#1594f5,#145fba);font-weight:900;font-size:19px;box-shadow:0 7px 30px #087de548}.brand-text{display:grid;gap:3px;min-width:0}.brand-text strong{font-size:16px;letter-spacing:-.04em}.brand-text small{font-size:11px;color:var(--muted);white-space:nowrap}.header-right{display:flex;align-items:center;gap:8px}.pill,.iconbtn,.ghost,.primary{border:1px solid var(--line);color:var(--white);background:#ffffff0a;transition:transform .2s ease,background .2s ease,border-color .2s ease}.pill:hover,.iconbtn:hover,.ghost:hover{background:#ffffff1d;border-color:#65b6f98a}.pill:active,.iconbtn:active,.ghost:active,.primary:active{transform:scale(.97)}.pill{padding:10px 15px;border-radius:30px;font-size:12px;white-space:nowrap}.iconbtn{width:41px;height:41px;display:grid;place-items:center;border-radius:13px;font-size:20px}.counter{font-size:13px;color:#b9d4f1;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px}.main{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding:clamp(12px,2vw,23px) clamp(12px,3.6vw,60px) 0;gap:13px}.section-line{width:min(1300px,100%);margin:auto;display:flex;gap:12px;justify-content:space-between;align-items:center;min-height:24px}.eyebrow{color:#8acaff;font-weight:800;letter-spacing:.1em;font-size:11px}.section-title{font-size:clamp(13px,1.5vw,17px);font-weight:750;letter-spacing:-.035em;margin-left:8px}.hint{font-size:12px;color:var(--muted)}.stage-wrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,28px);width:100%;max-width:1530px;margin:auto}.stage{width:min(100%,calc((100dvh - 218px)*1.7768));aspect-ratio:1672 / 941;max-height:calc(100dvh - 218px);position:relative;isolation:isolate;border-radius:clamp(9px,1.3vw,18px);box-shadow:var(--shadow);overflow:hidden;border:1px solid #ffffff36;background:#e5f4ff;flex-shrink:1;cursor:zoom-in}.stage:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff18;border-radius:inherit}.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:translateX(7%) scale(1.025);transition:transform .75s cubic-bezier(.22,1,.36,1),opacity .55s ease;will-change:opacity,transform;pointer-events:none}.slide.active{opacity:1;transform:translateX(0) scale(1);z-index:2}.slide.past{transform:translateX(-7%) scale(.985)}.sidebtn{flex:0 0 auto;width:46px;height:70px;border-radius:16px;background:#163455a8;border:1px solid #d4ecff36;color:#fff;font-size:26px;transition:.2s}.sidebtn:hover{background:#2372b0;transform:translateY(-2px)}.bottom{min-height:95px;padding:13px clamp(16px,3vw,48px) 18px;display:flex;align-items:center;gap:15px;justify-content:space-between}.progress-zone{flex:1;min-width:0;max-width:760px}.progress-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:11px;color:var(--muted);font-size:11px}.progress-track{height:5px;border-radius:10px;background:#ffffff21;overflow:hidden}.progress-fill{height:100%;width:10%;background:linear-gradient(90deg,#267aff,#66d7ff);border-radius:10px;transition:width .55s cubic-bezier(.22,1,.36,1)}.bottom-actions{display:flex;align-items:center;gap:8px}.ghost,.primary{border-radius:11px;padding:11px 15px;font-weight:750;font-size:12px}.primary{background:linear-gradient(125deg,#006ed9,#278fe8);border-color:#339deb;box-shadow:0 7px 24px #0061b43f}.primary:hover{background:#2189ee}.dots{display:flex;align-items:center;justify-content:center;gap:7px;padding:0 8px}.dot{border:0;background:#afbfcc70;width:6px;height:6px;border-radius:50%;padding:0;transition:.25s}.dot.active{width:23px;background:#62c6ff;border-radius:10px}.overlay{position:fixed;inset:0;z-index:30;background:#010916e6;backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:22px}.overlay.open{display:flex}.panel{width:min(1100px,100%);max-height:90dvh;overflow:auto;background:#102542;border:1px solid #c7e5ff31;border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.panel h2{font-size:clamp(20px,2.6vw,28px);margin:0 0 8px;letter-spacing:-.05em}.panel p{color:var(--muted);font-size:13px;margin:0}.thumbgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.thumb{border:1px solid #b4d4ff2b;border-radius:13px;background:#ffffff0a;padding:7px;color:#fff;text-align:left;transition:.2s}.thumb:hover,.thumb.selected{border-color:#66bdff;background:#318ddd20;transform:translateY(-2px)}.thumb img{width:100%;aspect-ratio:1672/941;object-fit:cover;border-radius:8px;display:block}.thumb span{display:block;padding:8px 3px 4px;font-size:12px;font-weight:700}.zoomview{max-width:96vw;max-height:92dvh;object-fit:contain;box-shadow:var(--shadow);border-radius:8px}.zoomclose{position:fixed;top:20px;right:22px;z-index:35}.help{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:#e4f4ff;background:#0f3d69ed;padding:11px 15px;border-radius:30px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:40}.help.show{opacity:1}.mobile-nav{display:none}.note{color:#91a6c0;font-size:11px;padding:0 4px;white-space:nowrap}.playing{border-color:#64c4ff;background:#277bb34d}
@media(max-width:900px){.thumbgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.sidebtn{width:37px;height:56px}.topbar{height:66px}.brand-text small{display:none}.main{padding:12px 10px 0}.stage{max-height:calc(100dvh - 200px);width:min(100%,calc((100dvh - 200px)*1.7768))}.bottom{min-height:96px}.hint{display:none}.dots{display:none}.note{display:none}}
@media(max-width:600px){.topbar{height:60px;padding:0 12px}.brandmark{height:33px;width:33px;font-size:16px;border-radius:10px}.brand-text strong{font-size:13px}.pill{padding:8px 10px;font-size:11px}.counter{font-size:11px;padding:0 2px}.header-right{gap:5px}.header-right .iconbtn:nth-of-type(2){display:none}.iconbtn{height:36px;width:36px;font-size:18px;border-radius:10px}.main{padding:10px 8px 0;gap:8px;grid-template-rows:auto 1fr}.section-title{font-size:13px}.stage-wrap{gap:0}.sidebtn{display:none}.stage{width:100%;max-height:none;aspect-ratio:1672/941;border-radius:9px;align-self:center}.bottom{padding:10px 12px 16px;min-height:110px;flex-direction:column-reverse;gap:13px;justify-content:center}.progress-zone{width:100%;max-width:none}.bottom-actions{justify-content:center}.ghost,.primary{padding:10px 14px}.mobile-nav{display:flex;position:absolute;bottom:calc(50% - min(27vw,115px));left:0;right:0;justify-content:space-between;pointer-events:none}.mobile-nav button{pointer-events:auto;border:1px solid #ffffff50;border-radius:10px;background:#082847b9;color:white;padding:8px 12px}.thumbgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.overlay{padding:10px}.panel{padding:16px}.help{bottom:120px;max-width:90vw;white-space:normal;text-align:center}}
@media(max-height:510px) and (orientation:landscape){.topbar{height:48px}.main{padding-top:5px;gap:3px}.section-line{display:none}.bottom{min-height:52px;padding:6px 16px}.stage{max-height:calc(100dvh - 112px);width:min(100%,calc((100dvh - 112px)*1.7768))}.progress-meta{margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>

<div class="shell">
<header class="topbar">
<a class="brand" href="#slide=1" aria-label="첫 슬라이드로 이동"><span class="brandmark">天</span><span class="brand-text"><strong>천안시 청년정책</strong><small>CHEONAN YOUTH POLICY · INTERACTIVE PRESENTATION</small></span></a>
<nav class="header-right" aria-label="프레젠테이션 탐색"><button class="pill" id="overviewBtn" aria-label="전체 슬라이드 목록 열기">☷ &nbsp;전체 슬라이드</button><span class="counter" id="headerCounter">01 / 10</span><button class="iconbtn" id="playBtn" title="자동 재생" aria-label="자동 재생 시작">▶</button><button class="iconbtn" id="fullscreenBtn" title="전체 화면" aria-label="전체 화면으로 보기">⛶</button></nav>

<main class="main" id="main">

<div class="stage-wrap"><button class="sidebtn" id="prevSide" aria-label="이전 슬라이드">‹</button><div class="stage" id="stage" role="region" aria-roledescription="슬라이드" aria-label="천안시 청년정책 프레젠테이션" tabindex="0"><img class="slide active" src="./assets/slide-01.webp" alt="슬라이드 1: 청년의 꿈이 현실이 되는 도시, 천안. 천안시 청년정책 한눈에 보기" draggable="false"><img class="slide" src="./assets/slide-02.webp" alt="슬라이드 2: 정책 비전. 청년의 오늘을 응원하고 내일을 함께 만듭니다. 취업, 창업, 주거, 교육" draggable="false"><img class="slide" src="./assets/slide-03.webp" alt="슬라이드 3: 청년의 삶을 지원하는 4가지 정책 분야: 취업, 창업, 주거, 교육" draggable="false"><img class="slide" src="./assets/slide-04.webp" alt="슬라이드 4: 취업 지원. 취업 역량 강화, 일경험 기회 제공, 일자리 연계" draggable="false"><img class="slide" src="./assets/slide-05.webp" alt="슬라이드 5: 창업 지원. 창업 준비 지원, 창업 공간 지원, 네트워킹 및 성장 지원" draggable="false"><img class="slide" src="./assets/slide-06.webp" alt="슬라이드 6: 주거 지원. 주거비 부담 완화, 주거 공간 지원, 주거 상담 및 정보 제공" draggable="false"><img class="slide" src="./assets/slide-07.webp" alt="슬라이드 7: 교육 및 성장 지원. 역량 강화 교육, 자기계발 지원, 성장 프로그램" draggable="false"><img class="slide" src="./assets/slide-08.webp" alt="슬라이드 8: 청년의 성장 스토리. 도전의 시작, 정책 참여, 역량 강화, 미래 도약" draggable="false"><img class="slide" src="./assets/slide-09.webp" alt="슬라이드 9: 정책 참여 방법. 정책 정보 확인, 지원 자격 확인, 신청 기간 확인, 신청하기" draggable="false"><img class="slide" src="./assets/slide-10.webp" alt="슬라이드 10: 마무리. 청년의 가능성이 천안의 미래입니다" draggable="false"></div><button class="sidebtn" id="nextSide" aria-label="다음 슬라이드">›</button></div>
</main>
<footer class="bottom"><div class="progress-zone"><div class="progress-meta"><span id="footerTitle">표지 · 천안시 청년정책 한눈에 보기</span><span id="progressPct">10%</span></div><div class="progress-track" role="progressbar" id="progressTrack" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1" aria-label="현재 슬라이드"><div class="progress-fill" id="progressFill"></div></div></div><div class="dots" id="dots" aria-label="슬라이드 바로가기"></div><div class="bottom-actions"><button class="ghost" id="prevBtn">← 이전</button><button class="primary" id="nextBtn">다음 슬라이드 →</button></div></footer>
</div>
<div class="overlay" id="overview" role="dialog" aria-modal="true" aria-labelledby="overviewTitle"><div class="panel"><div class="panel-head"><div><h2 id="overviewTitle">전체 슬라이드</h2><p>미리보기를 선택하면 해당 슬라이드로 이동합니다.</p></div><button class="iconbtn" id="overviewClose" aria-label="목록 닫기">✕</button></div><div class="thumbgrid" id="thumbgrid"></div><p style="margin-top:22px">※ 본 자료는 정책 이해를 돕기 위한 소개용입니다. 지원 조건과 공고는 천안시 공식 안내를 확인하세요.</p></div></div>
<div class="overlay" id="zoom" role="dialog" aria-modal="true" aria-label="슬라이드 확대 이미지"><button class="iconbtn zoomclose" id="zoomClose" aria-label="확대 닫기">✕</button><img class="zoomview" id="zoomImg" alt="확대된 슬라이드"></div>
<div class="help" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const slides=[
{title:'청년의 꿈이 현실이 되는 도시, 천안',short:'표지 · 청년정책 한눈에 보기',label:'INTRODUCTION'},
{title:'청년의 오늘을 응원하고 내일을 함께 만듭니다',short:'정책 비전',label:'VISION'},
{title:'청년의 삶을 지원하는 4가지 정책 분야',short:'4가지 정책 분야',label:'POLICY AREAS'},
{title:'청년의 도전이 일자리로 이어지도록',short:'취업 지원',label:'EMPLOYMENT'},
{title:'청년의 아이디어가 새로운 가능성이 됩니다',short:'창업 지원',label:'STARTUP'},
{title:'안정적인 주거가 청년의 미래를 만듭니다',short:'주거 지원',label:'HOUSING'},
{title:'더 많은 배움, 더 넓은 미래',short:'교육 및 성장 지원',label:'EDUCATION'},
{title:'천안에서 시작하는 나의 성장 여정',short:'청년의 성장 스토리',label:'GROWTH'},
{title:'나에게 맞는 지원정책, 지금 확인하세요!',short:'정책 참여 방법',label:'HOW TO APPLY'},
{title:'청년의 가능성이 천안의 미래입니다',short:'마무리',label:'CLOSING'}
];
const $=id=>document.getElementById(id), nodes=Array.from(document.querySelectorAll('.slide'));let current=0,playing=false,playTimer=null,lastWheel=0,touchStart=null,previousFocus=null;
const pad=n=>String(n).padStart(2,'0');
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function go(index){const next=Math.max(0,Math.min(9,index));if(next===current)return;current=next;render();history.replaceState(null,'','#slide='+(current+1));}
function render(){nodes.forEach((node,i)=>{node.classList.toggle('active',i===current);node.classList.toggle('past',i<current);node.setAttribute('aria-hidden',i!==current?'true':'false');});$('eyebrow').textContent=pad(current+1)+' / '+slides[current].label;$('sectionTitle').textContent=slides[current].title;$('footerTitle').textContent=slides[current].short;$('headerCounter').textContent=pad(current+1)+' / 10';$('progressPct').textContent=((current+1)*10)+'%';$('progressFill').style.width=((current+1)*10)+'%';$('progressTrack').setAttribute('aria-valuenow',current+1);$('prevBtn').disabled=$('prevSide').disabled=current===0;$('nextBtn').textContent=current===9?'처음으로 ↺':'다음 슬라이드 →';$('nextSide').title=current===9?'첫 슬라이드':'다음 슬라이드';document.querySelectorAll('.dot').forEach((b,i)=>{b.classList.toggle('active',i===current);b.setAttribute('aria-current',i===current?'step':'false')});document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('selected',i===current));}
function advance(){go(current===9?0:current+1)}
function modalOpen(id){previousFocus=document.activeElement;$(id).classList.add('open');(id==='overview'?$('overviewClose'):$('zoomClose')).focus();if(playing)togglePlay();}
function modalClose(id){$(id).classList.remove('open');previousFocus?.focus?.()}
function togglePlay(){playing=!playing;$('playBtn').textContent=playing?'Ⅱ':'▶';$('playBtn').classList.toggle('playing',playing);$('playBtn').setAttribute('aria-label',playing?'자동 재생 중지':'자동 재생 시작');clearInterval(playTimer);if(playing){playTimer=setInterval(advance,5500);notify('5.5초 간격으로 자동 재생합니다')}}
$('prevBtn').onclick=$('prevSide').onclick=()=>go(current-1);$('nextBtn').onclick=$('nextSide').onclick=advance;$('overviewBtn').onclick=()=>modalOpen('overview');$('overviewClose').onclick=()=>modalClose('overview');$('zoomClose').onclick=()=>modalClose('zoom');$('stage').onclick=()=>{$('zoomImg').src=nodes[current].src;$('zoomImg').alt=nodes[current].alt;modalOpen('zoom')};$('playBtn').onclick=togglePlay;
$('fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();notify('전체 화면으로 전환했습니다')}else await document.exitFullscreen()}catch(e){notify('이 브라우저에서는 전체 화면을 지원하지 않습니다')}};
const dots=$('dots'),grid=$('thumbgrid');slides.forEach((s,i)=>{let dot=document.createElement('button');dot.className='dot';dot.type='button';dot.title=pad(i+1)+' · '+s.short;dot.setAttribute('aria-label',(i+1)+'번 슬라이드 이동');dot.onclick=()=>go(i);dots.appendChild(dot);let t=document.createElement('button');t.className='thumb';t.type='button';const im=document.createElement('img');im.src='./assets/slide-'+pad(i+1)+'.webp';im.loading='lazy';im.alt=s.short;const text=document.createElement('span');text.textContent=pad(i+1)+' · '+s.short;t.append(im,text);t.onclick=()=>{go(i);modalClose('overview')};grid.appendChild(t)});
$('overview').addEventListener('click',e=>{if(e.target===$('overview'))modalClose('overview')});$('zoom').addEventListener('click',e=>{if(e.target===$('zoom')||e.target===$('zoomImg'))modalClose('zoom')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('zoom').classList.contains('open'))modalClose('zoom');else if($('overview').classList.contains('open'))modalClose('overview');else if(document.fullscreenElement)document.exitFullscreen();return}if($('overview').classList.contains('open')||$('zoom').classList.contains('open'))return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();advance()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(9)}else if(e.key.toLowerCase()==='o'){modalOpen('overview')}else if(e.key.toLowerCase()==='f'){$('fullscreenBtn').click()}});
document.addEventListener('wheel',e=>{if($('overview').classList.contains('open')||$('zoom').classList.contains('open'))return;if(Math.abs(e.deltaY)<13)return;const now=Date.now();if(now-lastWheel<800)return;lastWheel=now;if(e.deltaY>0)advance();else go(current-1)},{passive:true});
$('stage').addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('stage').addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){if(dx<0)advance();else go(current-1);$('stage').dataset.swiped='yes';setTimeout(()=>delete $('stage').dataset.swiped,50)}touchStart=null},{passive:true});
const origStage=$('stage').onclick;$('stage').onclick=e=>{if($('stage').dataset.swiped)return;origStage(e)};
window.addEventListener('hashchange',()=>{const m=location.hash.match(/slide=(\d+)/);if(m)go(Number(m[1])-1)});const match=location.hash.match(/slide=(\d+)/);if(match)current=Math.max(0,Math.min(9,Number(match[1])-1));render();
})();
</script>
</body>
</html>
